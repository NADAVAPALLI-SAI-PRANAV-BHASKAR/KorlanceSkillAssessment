<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="korlanceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#400C92"/>
      <stop offset="50%" stop-color="#5213B3"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5213B3"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#400C92" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Rounded Squircle -->
    <rect x="0" y="0" width="74" height="74" rx="18" fill="url(#korlanceGrad)"/>
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="1" y="1" width="72" height="72" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Geometric 'K' Mark -->
    <g fill="#FFFFFF">
      <!-- Vertical Stem -->
      <rect x="22" y="18" width="9" height="38" rx="2"/>
      
      <!-- Upper Diagonal Arm -->
      <path d="M28 36 L43 20 C44.5 18.5 47 19.5 47 21.5 L47 24 C47 25.2 46.4 26.3 45.4 27.1 L35.5 35 Z"/>
      
      <!-- Lower Diagonal Leg with Dynamic Flare -->
      <path d="M33 34 L47 50.5 C48 51.7 47.8 53.5 46.5 54.5 L44 56 C43 56.7 41.6 56.5 40.8 55.5 L28 40 Z"/>
      
      <!-- Precision Tech Accent Node -->
      <circle cx="49" cy="37" r="3" fill="#A855F7"/>
    </g>
  </g>

  <!-- Typography: Wordmark & Tagline -->
  <g transform="translate(98, 20)">
    <!-- Brand Wordmark -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, -apple-system, sans-serif" font-size="33" font-weight="900" letter-spacing="1.5" fill="#211A2E">
      KORLANCE
    </text>
    
    <!-- Corporate Sub-badge -->
    <rect x="180" y="13" width="122" height="19" rx="4" fill="#F3EAFE" stroke="#E9D5FF" stroke-width="1"/>
    <text x="186" y="27" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#5213B3">
      PRIVATE LIMITED
    </text>

    <!-- Official Corporate Tagline -->
    <text x="2" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.8" fill="#777184">
      BUILD TODAY, LEAD TOMORROW.
    </text>
    
    <!-- Accent Line Under Tagline -->
    <rect x="2" y="57" width="48" height="2" rx="1" fill="url(#accentGrad)"/>
  </g>
</svg>
