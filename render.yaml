services:
  - type: web
    name: korlance-assessment-platform
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn korlance_assessment.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: ADMIN_REPORT_EMAIL
        value: "Shaikbaji15102002@gmail.com"
